<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Sin imagen: perro y gato" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="circulo"><circle cx="100" cy="100" r="100"/></clipPath>
    <!-- Cabeza de perro: orejas erguidas y hocico largo -->
    <g id="perro">
      <path d="M0,-36 C19,-36 33,-26 34,-8 C34,6 29,16 24,24 C23,34 22,46 19,56 C16,62 -16,62 -19,56 C-22,46 -23,34 -24,24 C-29,16 -34,6 -34,-8 C-33,-26 -19,-36 0,-36 Z"/>
      <path d="M6,-33 C10,-44 20,-54 28,-58 C32,-59 34,-55 36,-48 C39,-38 40,-26 37,-16 C28,-22 16,-29 6,-33 Z"/>
      <path d="M -6,-33 C -10,-44 -20,-54 -28,-58 C -32,-59 -34,-55 -36,-48 C -39,-38 -40,-26 -37,-16 C -28,-22 -16,-29 -6,-33 Z"/>
    </g>
    <!-- Cabeza de gato: cabeza ancha y orejas en punta -->
    <g id="gato">
      <path d="M0,-28 C22,-28 42,-18 42,6 C42,28 24,42 0,42 C-24,42 -42,28 -42,6 C-42,-18 -22,-28 0,-28 Z"/>
      <path d="M-41,2 L-37,-46 Q-36,-49 -33,-47 L-8,-28 Z"/>
      <path d="M41,2 L37,-46 Q36,-49 33,-47 L8,-28 Z"/>
    </g>
  </defs>
  <g clip-path="url(#circulo)">
    <rect width="200" height="200" fill="#DEE2E6"/>
    <use href="#perro" transform="translate(69,94.9) scale(0.84)" fill="#8A8D91"/>
    <!-- borde claro del gato en una capa aparte, para que no marque rayas internas -->
    <use href="#gato" transform="translate(145,112) scale(0.84)" fill="#DEE2E6" stroke="#DEE2E6" stroke-width="7" stroke-linejoin="round"/>
    <use href="#gato" transform="translate(145,112) scale(0.84)" fill="#55575A"/>
  </g>
</svg>
